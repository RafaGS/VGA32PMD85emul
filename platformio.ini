[platformio]
default_envs = esp32dev_psram

[env]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; FabGL necesita Arduino-ESP32 2.x
; La plataforma 6.10.0 utiliza Arduino Core 2.0.17

board_build.partitions = huge_app.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi

lib_deps =
    https://github.com/fdivitto/FabGL.git

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Sin PSRAM (el emulador no la usa): opción recomendada
[env:esp32dev]

; Réplica exacta del build de arduino-cli, con PSRAM activada
[env:esp32dev_psram]
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -mfix-esp32-psram-cache-strategy=memw
